[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "speechmatics-batch-tools"
version = "0.1.0"
description = "Small command-line tools for Speechmatics batch transcription jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.12,<1.0",
    "types-requests>=2.32,<3.0",
]

[project.scripts]
speechmatics-start = "speechmatics_tools.start:main"
speechmatics-poll = "speechmatics_tools.poll:main"
speechmatics-download = "speechmatics_tools.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = ".local/cache/pytest"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
