name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy src scripts
      - run: python -m pytest -q
      - run: python -m compileall -q src scripts
      - run: git diff --check
      - name: Verify private workspace is untracked
        run: test -z "$(git ls-files -- .local)"
      - name: Build distributions
        run: python -m build
      - name: Smoke-test installed wheel
        run: |
          python -m venv .local/wheel-smoke
          .local/wheel-smoke/bin/python -m pip install dist/*.whl
          .local/wheel-smoke/bin/speechmatics-start --help
          .local/wheel-smoke/bin/speechmatics-poll --help
          .local/wheel-smoke/bin/speechmatics-download --help
          .local/wheel-smoke/bin/python -c "from importlib.resources import files; assert files('speechmatics_tools').joinpath('data/job-defaults.json').is_file()"
